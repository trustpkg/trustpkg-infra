
---
- name: Install UFW
  apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set default incoming policy
  ufw:
    direction: incoming
    policy: "{{ firewall_default_incoming }}"

- name: Set default outgoing policy
  ufw:
    direction: outgoing
    policy: "{{ firewall_default_outgoing }}"

- name: Configure UFW logging
  ufw:
    logging: "{{ firewall_logging }}"

- name: Allow SSH through Tailscale
  ufw:
    rule: allow
    interface: tailscale0
    direction: in
    port: "{{ firewall_ssh_port | string }}"
    proto: tcp

- name: Remove public SSH rule
  ufw:
    rule: allow
    port: "{{ firewall_ssh_port | string }}"
    proto: tcp
    delete: true
  when: firewall_restrict_ssh_to_tailscale | bool

- name: Allow public TCP ports
  ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ firewall_public_tcp_ports }}"

- name: Allow public UDP ports
  ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: udp
  loop: "{{ firewall_public_udp_ports }}"

- name: Enable UFW
  ufw:
    state: enabled

- name: Remove public HTTP rule
  ufw:
    rule: allow
    port: "80"
    proto: tcp
    delete: true

- name: Remove public HTTPS rule
  ufw:
    rule: allow
    port: "443"
    proto: tcp
    delete: true

- name: Allow S3 API through Tailscale
  ufw:
    rule: allow
    interface: tailscale0
    direction: in
    port: "9000"
    proto: tcp

- name: Allow RustFS console through Tailscale
  ufw:
    rule: allow
    interface: tailscale0
    direction: in
    port: "9001"
    proto: tcp
